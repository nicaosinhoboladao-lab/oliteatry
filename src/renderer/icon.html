<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #c { display: block; width: 512px; height: 512px; }
  svg { display: none; }
</style>
</head>
<body>
<!-- rasterised through a canvas so the alpha channel survives -->
<canvas id="c" width="512" height="512"></canvas>
<svg id="art" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1b40"/>
      <stop offset="1" stop-color="#170e24"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e7cd"/>
      <stop offset="1" stop-color="#d8c9a6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="92" fill="none" stroke="#b28b2c" stroke-width="3" opacity="0.55"/>

  <!-- hat -->
  <path d="M256 74 L372 208 L306 190 L256 232 L206 190 L140 208 Z" fill="#b28b2c"/>
  <path d="M140 208 L206 190 L192 246 Z" fill="#8e2f3c"/>
  <circle cx="372" cy="208" r="17" fill="#d9bd6d"/>
  <circle cx="140" cy="208" r="17" fill="#d9bd6d"/>

  <!-- head -->
  <circle cx="256" cy="316" r="118" fill="url(#paper)" stroke="#241528" stroke-width="6"/>
  <!-- eyes -->
  <circle cx="214" cy="300" r="17" fill="#241528"/>
  <circle cx="298" cy="300" r="17" fill="#241528"/>
  <circle cx="219" cy="294" r="4.5" fill="#f1e7cd" opacity="0.8"/>
  <circle cx="303" cy="294" r="4.5" fill="#f1e7cd" opacity="0.8"/>
  <!-- nose -->
  <circle cx="256" cy="342" r="15" fill="#8e2f3c"/>
  <!-- smile -->
  <path d="M206 366 Q256 412 306 366" stroke="#8e2f3c" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- collar -->
  <path d="M150 430 L206 396 L256 430 L306 396 L362 430" fill="none" stroke="#b28b2c" stroke-width="13" stroke-linejoin="round"/>

  <rect x="0" y="0" width="512" height="512" rx="104" filter="url(#grain)" opacity="0.5"/>
</svg>
<script>
  (function () {
    const svg = document.getElementById('art');
    const xml = new XMLSerializer().serializeToString(svg);
    const img = new Image();
    img.onload = () => {
      const c = document.getElementById('c');
      c.getContext('2d').drawImage(img, 0, 0, 512, 512);
      window.__icon = c.toDataURL('image/png');
    };
    img.onerror = () => { window.__iconError = 'svg rasterise failed'; };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
  })();
</script>
</body>
</html>
